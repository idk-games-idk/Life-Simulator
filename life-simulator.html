<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Simulator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: white;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 48px;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
        }
        .stats-panel {
            grid-column: 1 / -1;
        }
        h2 {
            font-size: 28px;
            margin: 0 0 20px 0;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            padding-bottom: 10px;
        }
        .stat-bar {
            margin-bottom: 20px;
        }
        .stat-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .bar-container {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            height: 25px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.3s;
            border-radius: 10px;
        }
        .health-bar { background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%); }
        .happiness-bar { background: linear-gradient(90deg, #ffd700 0%, #ffa500 100%); }
        .energy-bar { background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%); }
        .money-bar { background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%); }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .info-item {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .info-label {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        .info-value {
            font-size: 24px;
            font-weight: bold;
        }
        .action-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .action-btn:hover {
            background: rgba(255,255,255,0.3);
            border-color: #ffd700;
            transform: translateX(5px);
        }
        .action-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .action-btn.disabled:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.3);
            transform: none;
        }
        .action-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .action-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .action-desc {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 8px;
        }
        .action-cost {
            font-size: 14px;
            color: #ffd700;
        }
        .log-panel {
            grid-column: 1 / -1;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-entry {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .log-time {
            color: #ffd700;
            margin-right: 10px;
        }
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .info-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌟 Life Simulator</h1>
        </div>
        
        <div class="main-grid">
            <div class="panel stats-panel">
                <h2>Your Stats</h2>
                <div class="stat-bar">
                    <div class="stat-label">
                        <span>❤️ Health</span>
                        <span id="health-val">100</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill health-bar" id="health-bar" style="width: 100%"></div>
                    </div>
                </div>
                <div class="stat-bar">
                    <div class="stat-label">
                        <span>😊 Happiness</span>
                        <span id="happiness-val">100</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill happiness-bar" id="happiness-bar" style="width: 100%"></div>
                    </div>
                </div>
                <div class="stat-bar">
                    <div class="stat-label">
                        <span>⚡ Energy</span>
                        <span id="energy-val">100</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill energy-bar" id="energy-bar" style="width: 100%"></div>
                    </div>
                </div>
                <div class="stat-bar">
                    <div class="stat-label">
                        <span>💰 Money</span>
                        <span id="money-val">$100</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill money-bar" id="money-bar" style="width: 10%"></div>
                    </div>
                </div>
                
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">Age</div>
                        <div class="info-value" id="age">18</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Job</div>
                        <div class="info-value" id="job">Unemployed</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Education</div>
                        <div class="info-value" id="education">High School</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Day</div>
                        <div class="info-value" id="day">1</div>
                    </div>
                </div>
            </div>
            
            <div class="panel">
                <h2>Work & Study</h2>
                <div id="work-actions"></div>
            </div>
            
            <div class="panel">
                <h2>Activities</h2>
                <div id="activity-actions"></div>
            </div>
            
            <div class="panel log-panel">
                <h2>Activity Log</h2>
                <div id="log"></div>
            </div>
        </div>
    </div>
    
    <script>
        var stats = {
            health: 100,
            happiness: 100,
            energy: 100,
            money: 100,
            age: 18,
            day: 1,
            job: 'Unemployed',
            education: 'High School'
        };

        var workActions = [
            {id: 'parttime', name: 'Part-time Job', icon: '🍔', desc: 'Work at a fast food restaurant', energy: 20, money: 25, time: 1, requires: null},
            {id: 'study', name: 'Study', icon: '📚', desc: 'Improve your education', energy: 15, happiness: -5, time: 1, requires: null, eduPoints: 10},
            {id: 'college', name: 'Go to College', icon: '🎓', desc: 'Get a degree', energy: 25, money: -50, time: 1, requires: 'High School', eduPoints: 20},
            {id: 'officejob', name: 'Office Job', icon: '💼', desc: 'Work a desk job', energy: 30, money: 75, time: 1, requires: 'College'},
            {id: 'business', name: 'Start Business', icon: '🏢', desc: 'Become an entrepreneur', energy: 40, money: 150, time: 1, requires: 'College'}
        ];

        var activityActions = [
            {id: 'sleep', name: 'Sleep', icon: '😴', desc: 'Rest and recover energy', energy: -50, health: 5, time: 1},
            {id: 'exercise', name: 'Exercise', icon: '💪', desc: 'Improve your health', energy: 15, health: 10, happiness: 5, time: 1},
            {id: 'socialize', name: 'Socialize', icon: '👥', desc: 'Hang out with friends', energy: 10, happiness: 15, time: 1},
            {id: 'entertain', name: 'Entertainment', icon: '🎮', desc: 'Play games or watch TV', energy: 5, happiness: 10, money: -10, time: 1},
            {id: 'eat', name: 'Eat Meal', icon: '🍕', desc: 'Restore health and energy', energy: -10, health: 10, money: -15, time: 0}
        ];

        var eduPoints = 0;
        var logMessages = [];

        function update_ui() {
            document.getElementById('health-val').textContent = Math.floor(stats.health);
            document.getElementById('happiness-val').textContent = Math.floor(stats.happiness);
            document.getElementById('energy-val').textContent = Math.floor(stats.energy);
            document.getElementById('money-val').textContent = '$' + Math.floor(stats.money);
            document.getElementById('age').textContent = stats.age;
            document.getElementById('job').textContent = stats.job;
            document.getElementById('education').textContent = stats.education;
            document.getElementById('day').textContent = stats.day;
            
            document.getElementById('health-bar').style.width = Math.max(0, Math.min(100, stats.health)) + '%';
            document.getElementById('happiness-bar').style.width = Math.max(0, Math.min(100, stats.happiness)) + '%';
            document.getElementById('energy-bar').style.width = Math.max(0, Math.min(100, stats.energy)) + '%';
            document.getElementById('money-bar').style.width = Math.max(0, Math.min(100, stats.money / 10)) + '%';
            
            render_actions();
            render_log();
        }

        function can_do_action(action) {
            if (action.energy && stats.energy < action.energy) return false;
            if (action.money && action.money < 0 && stats.money < Math.abs(action.money)) return false;
            if (action.requires && stats.education !== action.requires) return false;
            return true;
        }

        function do_action(action, event) {
            event.stopPropagation();
            if (!can_do_action(action)) return;
            
            if (action.energy) stats.energy -= action.energy;
            if (action.health) stats.health += action.health;
            if (action.happiness) stats.happiness += action.happiness;
            if (action.money) stats.money += action.money;
            if (action.eduPoints) eduPoints += action.eduPoints;
            
            stats.health = Math.max(0, Math.min(100, stats.health));
            stats.happiness = Math.max(0, Math.min(100, stats.happiness));
            stats.energy = Math.max(0, Math.min(100, stats.energy));
            stats.money = Math.max(0, stats.money);
            
            if (action.time) {
                stats.day += action.time;
            }
            
            if (action.id === 'parttime') {
                stats.job = 'Fast Food Worker';
            } else if (action.id === 'officejob') {
                stats.job = 'Office Worker';
            } else if (action.id === 'business') {
                stats.job = 'Business Owner';
            }
            
            if (eduPoints >= 50 && stats.education === 'High School') {
                stats.education = 'College';
                add_log('🎓 You graduated college!');
                eduPoints = 0;
            }
            
            add_log(action.icon + ' ' + action.name);
            
            if (stats.day % 365 === 0) {
                stats.age++;
                add_log('🎂 Happy Birthday! You are now ' + stats.age + ' years old.');
            }
            
            update_ui();
        }

        function render_actions() {
            var workDiv = document.getElementById('work-actions');
            workDiv.innerHTML = '';
            workActions.forEach(function(action) {
                var canDo = can_do_action(action);
                var div = document.createElement('div');
                div.className = 'action-btn' + (canDo ? '' : ' disabled');
                div.onclick = function(e) { do_action(action, e); };
                
                var costs = [];
                if (action.energy > 0) costs.push('-' + action.energy + ' ⚡');
                if (action.money && action.money < 0) costs.push('-$' + Math.abs(action.money));
                if (action.money && action.money > 0) costs.push('+$' + action.money);
                
                div.innerHTML = 
                    '<div class="action-icon">' + action.icon + '</div>' +
                    '<div class="action-name">' + action.name + '</div>' +
                    '<div class="action-desc">' + action.desc + '</div>' +
                    '<div class="action-cost">' + costs.join(' | ') + '</div>';
                workDiv.appendChild(div);
            });
            
            var actDiv = document.getElementById('activity-actions');
            actDiv.innerHTML = '';
            activityActions.forEach(function(action) {
                var canDo = can_do_action(action);
                var div = document.createElement('div');
                div.className = 'action-btn' + (canDo ? '' : ' disabled');
                div.onclick = function(e) { do_action(action, e); };
                
                var effects = [];
                if (action.energy && action.energy > 0) effects.push('-' + action.energy + ' ⚡');
                if (action.energy && action.energy < 0) effects.push('+' + Math.abs(action.energy) + ' ⚡');
                if (action.health && action.health > 0) effects.push('+' + action.health + ' ❤️');
                if (action.happiness && action.happiness > 0) effects.push('+' + action.happiness + ' 😊');
                if (action.money && action.money < 0) effects.push('-$' + Math.abs(action.money));
                
                div.innerHTML = 
                    '<div class="action-icon">' + action.icon + '</div>' +
                    '<div class="action-name">' + action.name + '</div>' +
                    '<div class="action-desc">' + action.desc + '</div>' +
                    '<div class="action-cost">' + effects.join(' | ') + '</div>';
                actDiv.appendChild(div);
            });
        }

        function add_log(message) {
            logMessages.unshift({time: 'Day ' + stats.day, msg: message});
            if (logMessages.length > 10) logMessages.pop();
        }

        function render_log() {
            var logDiv = document.getElementById('log');
            logDiv.innerHTML = '';
            logMessages.forEach(function(entry) {
                var div = document.createElement('div');
                div.className = 'log-entry';
                div.innerHTML = '<span class="log-time">' + entry.time + '</span>' + entry.msg;
                logDiv.appendChild(div);
            });
        }

        setInterval(function() {
            stats.happiness = Math.max(0, stats.happiness - 0.1);
            stats.energy = Math.max(0, stats.energy - 0.05);
            update_ui();
        }, 1000);

        update_ui();
    </script>
</body>
</html>
